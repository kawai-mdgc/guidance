<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gaiheki+ エディタ</title>
<style>
:root{--main:#3F3277;--accent:#E55A00;--bg:#F3F3F3;--text:#1a1a1a;--white:#ffffff;--border:#d0d0d0;--label:#555555;--muted:#999999;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ── Header ── */
.header{height:52px;background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:6px;flex-shrink:0;overflow-x:auto;}
.h-logo{font-size:16px;font-weight:800;color:var(--main);text-decoration:none;white-space:nowrap;flex-shrink:0;letter-spacing:-.5px;}
.h-div{width:1px;height:18px;background:var(--border);flex-shrink:0;margin:0 2px;}
.h-tabs{display:flex;gap:3px;flex-shrink:0;}
.h-tab{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:none;font-size:11px;color:var(--label);cursor:pointer;transition:all .12s;white-space:nowrap;font-family:inherit;}
.h-tab.active{background:var(--main);color:var(--white);border-color:var(--main);font-weight:700;}
.h-tab:hover:not(.active):not(.disabled){border-color:var(--main);color:var(--main);}
.h-tab.disabled{opacity:.4;cursor:default;pointer-events:none;}
.h-tab.custom-tab{display:flex;align-items:center;gap:4px;}
.tab-x{opacity:.5;cursor:pointer;font-size:12px;line-height:1;}
.tab-x:hover{opacity:1;}
.btn-addp{padding:4px 8px;border:1px dashed #bbb;border-radius:4px;background:none;font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;}
.btn-addp:hover{border-color:var(--main);color:var(--main);}
.h-space{flex:1;}
.btn-save{padding:6px 18px;background:var(--main);color:var(--white);border:none;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;}
.btn-save:hover{opacity:.85;}

/* ── Main ── */
.main{flex:1;display:flex;overflow:hidden;}

/* ── Preview ── */
.preview-pane{width:60%;overflow:auto;background:#c8c8c8;padding:16px;display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.a4-outer{width:794px;background:var(--white);box-shadow:0 2px 10px rgba(0,0,0,.2);min-height:300px;}
/* gaiheki-create.html と同じスタイル */
.page-hbar{background:var(--main);color:#fff;padding:12px 32px;display:flex;justify-content:space-between;align-items:center;}
.phb-brand{font-size:17px;font-weight:800;letter-spacing:-.5px;}
.pc-wrap{padding:10px 32px 24px;}
.doc-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11.5px;margin-bottom:12px;}
.doc-table td{border:1px solid #d0d0d0;vertical-align:top;padding:8px 12px;}
.doc-table .sh td{background:#eeecf8;color:var(--main);font-size:11.5px;font-weight:700;padding:8px 12px;border-top:1px solid #d0d0d0;border-left:1px solid #d0d0d0;letter-spacing:.02em;}
.doc-table .k{background:#F3F3F3!important;color:var(--main)!important;font-size:11.5px!important;font-weight:600!important;width:220px!important;min-width:220px!important;max-width:220px!important;vertical-align:middle!important;white-space:nowrap!important;padding:8px 20px!important;}
.doc-table .v{background:var(--white);color:var(--text);font-size:11.5px;vertical-align:middle;}
.doc-table .note{font-size:11px;color:var(--label);line-height:1.8;}
.sub-note{font-size:10px;color:var(--muted);margin-left:8px;}
.url-val{color:var(--main);text-decoration:underline;word-break:break-all;}
.pv-inner{max-width:760px;margin:0;font-size:11.5px;color:var(--label);line-height:1.9;padding:0 8px;}
.pv-unavail{padding:48px;text-align:center;color:var(--muted);font-size:13px;}

/* ── Editor ── */
.editor-pane{width:40%;overflow-y:auto;padding:12px 14px;background:#efefef;border-left:1px solid var(--border);}
.non-edit-msg{background:var(--white);border-radius:8px;padding:40px;text-align:center;color:var(--muted);font-size:13px;margin-top:16px;border:2px dashed var(--border);}

/* block cards */
.block-card{background:var(--white);border:1px solid var(--border);border-radius:6px;margin-bottom:5px;user-select:none;}
.block-card.dragging{opacity:.35;}
.block-card.drag-over{border-color:var(--main);box-shadow:0 0 0 2px rgba(63,50,119,.15);background:#faf9ff;}
.bc-head{display:flex;align-items:center;gap:5px;padding:7px 10px;cursor:default;min-height:36px;}
.bc-drag{font-size:15px;color:#ccc;cursor:grab;flex-shrink:0;line-height:1;}
.bc-drag:hover{color:var(--main);}
.bc-badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap;flex-shrink:0;}
.bc-prev{flex:1;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.bc-btn{padding:2px 6px;border-radius:3px;border:1px solid #e0e0e0;background:var(--white);font-size:10px;cursor:pointer;flex-shrink:0;font-family:inherit;color:var(--label);}
.bc-btn:hover{border-color:var(--main);color:var(--main);}
.bc-btn.del{border-color:#fca5a5;color:#ef4444;}
.bc-btn.del:hover{background:#fef2f2;}
.btn-add-block{width:100%;padding:10px;background:var(--white);border:2px dashed #ccc;border-radius:6px;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;margin-top:8px;transition:all .12s;}
.btn-add-block:hover{border-color:var(--main);color:var(--main);background:#faf9ff;}

/* Modals */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--white);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.22);z-index:201;display:none;width:540px;max-width:96vw;max-height:86vh;overflow-y:auto;}
.m-head{padding:15px 20px 11px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;}
.m-body{padding:14px 20px;}
.m-foot{padding:11px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.m-lbl{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;margin-top:10px;}
.m-lbl:first-child{margin-top:0;}
.m-inp{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit;}
.m-inp:focus{outline:none;border-color:var(--main);}
.m-ta{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit;resize:vertical;min-height:72px;line-height:1.5;}
.m-ta:focus{outline:none;border-color:var(--main);}
.m-sel{padding:6px 10px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit;background:var(--white);}
.btn-cancel{padding:6px 14px;background:var(--white);border:1px solid var(--border);border-radius:4px;font-size:12px;cursor:pointer;font-family:inherit;}
.btn-ok{padding:6px 16px;background:var(--main);color:var(--white);border:none;border-radius:4px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.type-btn{padding:10px 6px;border:1px solid var(--border);border-radius:6px;background:var(--white);cursor:pointer;text-align:center;font-family:inherit;transition:all .12s;}
.type-btn:hover{border-color:var(--main);background:#faf9ff;}
.type-btn .tbl{font-size:11px;font-weight:700;display:block;margin-bottom:2px;}
.type-btn .tbd{font-size:10px;color:var(--muted);}

/* Toast */
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:7px 18px;border-radius:6px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:300;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<header class="header">
  <a class="h-logo" href="gaiheki.html">gaiheki+</a>
  <div class="h-div"></div>
  <div class="h-tabs" id="h-tabs"></div>
  <button class="btn-addp" onclick="openAddPageModal()">＋ ページ追加</button>
  <div class="h-space"></div>
  <button class="btn-save" onclick="saveAll()">保存</button>
</header>

<div class="main">
  <div class="preview-pane">
    <div class="a4-outer">
      <div class="page-hbar">
        <span class="phb-brand">gaiheki+</span>
        <span style="font-size:11px;opacity:.7">プレビュー</span>
      </div>
      <div class="pc-wrap" id="preview-wrap">
        <div id="preview-content"></div>
      </div>
    </div>
  </div>
  <div class="editor-pane" id="editor-pane">
    <div id="non-edit-msg" class="non-edit-msg" style="display:none">このページは編集できません</div>
    <div id="block-list"></div>
    <button class="btn-add-block" id="btn-add-block" onclick="openAddModal()" style="display:none">＋ ブロックを追加</button>
  </div>
</div>

<div class="ov" id="ov" onclick="closeModals()"></div>

<div class="modal" id="add-modal">
  <div class="m-head">ブロックタイプを選択</div>
  <div class="m-body"><div class="type-grid" id="type-grid"></div></div>
  <div class="m-foot"><button class="btn-cancel" onclick="closeModals()">キャンセル</button></div>
</div>

<div class="modal" id="edit-modal">
  <div class="m-head" id="edit-modal-title">ブロックを編集</div>
  <div class="m-body" id="edit-modal-body"></div>
  <div class="m-foot">
    <button class="btn-cancel" onclick="closeModals()">キャンセル</button>
    <button class="btn-ok" onclick="confirmEdit()">保存</button>
  </div>
</div>

<div class="modal" id="addp-modal">
  <div class="m-head">ページを追加</div>
  <div class="m-body">
    <label class="m-lbl">ページ名</label>
    <input class="m-inp" id="new-page-name" placeholder="例）追加資料">
  </div>
  <div class="m-foot">
    <button class="btn-cancel" onclick="closeModals()">キャンセル</button>
    <button class="btn-ok" onclick="addCustomPage()">追加</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── Pages ── */
const FIXED = [
  {id:'p1',      name:'ご確認事項',                  editable:true },
  {id:'p-manual',name:'管理画面の使い方',              editable:false},
  {id:'p2',      name:'写真ご提供のお願い',             editable:true },
  {id:'p3',      name:'現調 / 成約に繋げるための施策', editable:true },
  {id:'p4',      name:'CS担当者',                    editable:false},
];

/* ── Block types ── */
const BT = [
  {type:'sh',      label:'セクション見出し',   bb:'#3F3277',bg:'#fff', desc:'紫ヘッダー行（テーブル）',
   fields:[{k:'text',l:'テキスト'}]},
  {type:'k-v',     label:'テーブル行（1列）',  bb:'#607D8B',bg:'#fff', desc:'ラベル＋値（2カラム）',
   fields:[{k:'label',l:'ラベル'},{k:'value',l:'値',ml:true}]},
  {type:'k-v-k-v', label:'テーブル行（2列）',  bb:'#546E7A',bg:'#fff', desc:'ラベル＋値 × 2',
   fields:[{k:'label1',l:'ラベル1'},{k:'value1',l:'値1'},{k:'label2',l:'ラベル2'},{k:'value2',l:'値2'}]},
  {type:'note-row',label:'全幅テキスト行',     bb:'#78909C',bg:'#fff', desc:'テーブル内の全幅テキスト',
   fields:[{k:'text',l:'テキスト',ml:true}]},
  {type:'heading', label:'タイトル',           bb:'#1a1a1a',bg:'#fff', desc:'ページ大見出し',
   fields:[{k:'text',l:'テキスト'}]},
  {type:'body',    label:'本文',               bb:'#757575',bg:'#fff', desc:'通常テキスト（**太字**・改行対応）',
   fields:[{k:'text',l:'テキスト',ml:true}]},
  {type:'bold',    label:'太字',               bb:'#424242',bg:'#fff', desc:'強調テキスト',
   fields:[{k:'text',l:'テキスト',ml:true}]},
  {type:'highlight',label:'背景ありラベル',   bb:'#e8e6f3',bg:'#3d3580',desc:'薄紫背景・紫文字',
   fields:[{k:'text',l:'テキスト'}]},
  {type:'note',    label:'補足テキスト',       bb:'#f0f0f0',bg:'#888', desc:'グレー小文字（※〜）',
   fields:[{k:'text',l:'テキスト',ml:true}]},
  {type:'url-block',label:'URLブロック',      bb:'#1565C0',bg:'#fff', desc:'ラベル＋URLリンク',
   fields:[{k:'label',l:'ラベルテキスト'},{k:'url',l:'URL',ph:'https://...'}]},
  {type:'spacer',  label:'余白',               bb:'#e0e0e0',bg:'#666', desc:'垂直スペース（小/中/大）',isSpecial:true},
];

/* ── Defaults ── */
function mkb(type, extra){ return Object.assign({id:'b_'+Date.now()+'_'+Math.random().toString(36).slice(2,5), type}, extra); }

const DEF = {
  p1:[
    mkb('sh',{text:'① 料金について'}),
    mkb('k-v',{label:'契約プラン',value:'（フォームから設定）'}),
    mkb('k-v-k-v',{label1:'月額費用（税抜）',value1:'（フォームから）',label2:'成約手数料',value2:'（フォームから）'}),
    mkb('k-v',{label:'契約期間',value:'（フォームから設定）'}),
    mkb('k-v-k-v',{label1:'紹介件数想定（月間）',value1:'（フォームから）',label2:'紹介件数想定（6ヶ月）',value2:'（フォームから）'}),
    mkb('k-v',{label:'最低保証',value:'（フォームから設定）'}),
    mkb('sh',{text:'② 対応エリア'}),
    mkb('note-row',{text:'（フォームから設定）'}),
    mkb('sh',{text:'③ お支払いについて'}),
    mkb('k-v',{label:'決済手段',value:'（フォームから設定）'}),
    mkb('k-v',{label:'備考',value:'（フォームから設定）'}),
    mkb('sh',{text:'④ 休業日について'}),
    mkb('note-row',{text:'弊社は基本的にカレンダー通りの営業となるため、土日祝日は営業しておりません。\n配信内容の変更等を含め、ご連絡は平日 09:00〜19:00 の間にお願いいたします。'}),
    mkb('sh',{text:'⑤ 除外となり得るお客様情報について'}),
    mkb('note-row',{text:'・30日以内の、同一人物からの重複申込\n・使用されていない電話番号\n・別人の人（例：山田 太郎）\n上記にあてはまるお客様情報については、お手数ですが私までご報告ください。'}),
    mkb('sh',{text:'⑦ 顧客管理システムのログイン情報について'}),
    mkb('k-v',{label:'ログインURL',value:'（URL設定から反映）'}),
    mkb('k-v',{label:'ID',value:'（フォームから設定）'}),
  ],
  p2:[
    mkb('heading',{text:'現場・会社の写真ご提供のお願い'}),
    mkb('spacer',{size:'md'}),
    mkb('highlight',{text:'実際に写真の掲載をお願いしている理由'}),
    mkb('body',{text:'・実際に成約率やアポ率が高くなるというデータが出ている\n・施工の丁寧さや雰囲気が伝わりやすく満足度が上がる\n・結果として利益が伸びる'}),
    mkb('spacer',{size:'sm'}),
    mkb('body',{text:'スマホ撮影の写真でも問題ありませんので、\n下記フォームより2〜5枚ほどご提供をお願いいたします。'}),
    mkb('url-block',{label:'▼写真アップロードフォーム',url:''}),
    mkb('spacer',{size:'sm'}),
    mkb('bold',{text:'【おすすめの写真例】'}),
    mkb('body',{text:'・施工中の様子（職人さんの手元や後ろ姿など）\n・会社外観や社内の様子\n・スタッフ集合写真、看板、車両など'}),
    mkb('note',{text:'※お送りいただいた素材は掲載前に確認のうえ、内容に問題のない範囲で使用いたします。'}),
    mkb('spacer',{size:'sm'}),
    mkb('body',{text:'お手数おかけしてしまいますが、\nご協力のほど、どうぞよろしくお願いいたします。'}),
    mkb('url-block',{label:'▼加盟店様の紹介ページ',url:''}),
    mkb('spacer',{size:'md'}),
    mkb('bold',{text:'【管理画面へ追加で欲しい機能について】'}),
    mkb('body',{text:'普段、使っている機能や管理システム等が弊社管理画面にもあれば便利なのに！！\nのようなことがあればお願い致します！'}),
  ],
  p3:[
    mkb('heading',{text:'＜現調 / 成約に繋げるための施策＞'}),
    mkb('highlight',{text:'【ローンについて】'}),
    mkb('body',{text:'**エンドユーザー様向けローン**を導入することとなりました。\n外壁・屋根工事は高額になりやすく、\n「金額で迷われる」「今は難しいと言われる」\nといった理由で失注してしまうケースも少なくありません。'}),
    mkb('body',{text:'ローンが利用可能になることで、\n・月々払いでのご提案が可能\n・予算で迷われているお客様の後押し\n・ワンランク上の工事提案がしやすくなる\n→ 結果として成約率向上が期待できます。'}),
    mkb('bold',{text:'【加盟店様の費用負担・手数料負担はございません。】'}),
    mkb('note',{text:'※お客様にも所定の審査がございます。'}),
    mkb('body',{text:'導入をご希望の加盟店様は、\n下記資料をお目通しいただけますと幸いです。'}),
    mkb('url-block',{label:'【媒体資料】',url:'https://drive.google.com/file/d/1eYcxVHQ9Bdwpe0sgHwFJ5QHvQeRa-9oX/view?usp=sharing'}),
    mkb('url-block',{label:'【お申込書】',url:'https://drive.google.com/file/d/1YWvqYl0y2YJdtkg9s-9Umu8nKb_xF_c8/view?usp=sharing'}),
    mkb('spacer',{size:'md'}),
    mkb('highlight',{text:'【下記、弊社からお支払いをさせて頂きます！】'}),
    mkb('bold',{text:'アマギフ1000円　現地調査完了＆お見積書提示'}),
    mkb('url-block',{label:'申請フォーム（現調完了）',url:'https://docs.google.com/forms/d/e/1FAIpQLSfRrZcyFszZbp4Qrb_HJ2NTVMfgzRu-NoAT2buCPvu8tWBvmQ/viewform?usp=dialog'}),
    mkb('bold',{text:'作業金額の1%のアマギフ　作業完了後'}),
    mkb('url-block',{label:'申請フォーム（作業完了）',url:'https://docs.google.com/forms/d/e/1FAIpQLSc6mL6HfKFGRqIBVfyBSCxbvmeMIZL9Jn6HeThZyb0G_nHV4w/viewform?usp=di'}),
    mkb('spacer',{size:'sm'}),
    mkb('bold',{text:'＜使い方＞'}),
    mkb('body',{text:'現地調査完了でAmazonギフト1000円分、作業完了でさらに金額の1％分のAmazonギフトをプレゼントさせていただきます。\nこれを営業トークのフックとして使っていただくことが可能なので、まずは現地見積もりにつなげるために「Amazonギフト券」をフックにして、現地見積もりのアポイントを打診してみてください。\nなお、Amazonギフト自体は弊社から直接お客様にお送りする形となります。'}),
  ],
};

/* ── State ── */
let cur = 'p1';
let pages = {};      // id → {blocks:[]}
let customs = [];    // [{id,name}]
let editIdx = -1;
let isNewBlock = false;
let newType = null;
let dragFrom = -1;

/* ── Utils ── */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function proc(s){return esc(s).replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');}
function uid(){return 'b_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

/* ── Render block → HTML ── */
const TABLE_T=['sh','k-v','k-v-k-v','note-row'];

function b2h(b){
  switch(b.type){
    case 'sh':       return `<tr class="sh"><td colspan="4">${esc(b.text)}</td></tr>`;
    case 'k-v':      return `<tr><td class="k">${esc(b.label)}</td><td class="v" colspan="3" style="padding:8px 12px">${proc(b.value)}</td></tr>`;
    case 'k-v-k-v':  return `<tr><td class="k">${esc(b.label1)}</td><td class="v" style="padding:8px 12px">${proc(b.value1)}</td><td class="k">${esc(b.label2)}</td><td class="v" style="padding:8px 12px">${proc(b.value2)}</td></tr>`;
    case 'note-row': return `<tr><td colspan="4" class="v note" style="padding:8px 20px">${proc(b.text)}</td></tr>`;
    case 'heading':  return `<div style="font-size:20px;font-weight:700;color:#1a1a1a;margin-top:32px;margin-bottom:14px">${esc(b.text)}</div>`;
    case 'body':     return `<div style="margin-bottom:12px;line-height:1.9">${proc(b.text)}</div>`;
    case 'bold':     return `<div style="margin-bottom:12px"><strong>${proc(b.text)}</strong></div>`;
    case 'highlight':return `<span style="display:inline-block;background:#e8e6f3;color:#3d3580;font-weight:700;padding:3px 10px;border-radius:3px;margin-bottom:4px">${esc(b.text)}</span><br>`;
    case 'note':     return `<div style="font-size:11px;color:#888;margin-bottom:6px">${proc(b.text)}</div>`;
    case 'spacer':{  const h={sm:16,md:32,lg:64}[b.size||'md']; return `<div style="height:${h}px"></div>`;}
    case 'url-block':return `<div style="margin-bottom:10px">${esc(b.label)}<br><a class="url-val" href="${esc(b.url)}" target="_blank">${esc(b.url)||'（URL未設定）'}</a></div>`;
    default: return '';
  }
}

function blocks2html(arr){
  const parts=[]; let rows=[];
  const flush=()=>{if(rows.length){parts.push(`<table class="doc-table"><colgroup><col style="width:220px"><col><col style="width:220px"><col></colgroup>${rows.join('')}</table>`);rows=[];}};
  (arr||[]).forEach(b=>{if(TABLE_T.includes(b.type))rows.push(b2h(b));else{flush();parts.push(b2h(b));}});
  flush(); return parts.join('');
}

/* ── Storage ── */
function load(){
  try{
    const r=localStorage.getItem('gaiheki_editor_pages');
    if(r){const d=JSON.parse(r);pages=d.pages||{};customs=d.customPages||[];}
  }catch(e){}
  ['p1','p2','p3'].forEach(id=>{
    if(!pages[id]||!pages[id].blocks||!pages[id].blocks.length)
      pages[id]={blocks:JSON.parse(JSON.stringify(DEF[id]||[]))};
  });
}

function saveAll(){
  // sync url-blocks
  Object.values(pages).forEach(pd=>{(pd.blocks||[]).forEach(b=>{if(b.type==='url-block'&&b.url)syncUrl(b);});});
  localStorage.setItem('gaiheki_editor_pages',JSON.stringify({pages,customPages:customs}));
  toast('保存しました');
}

function syncUrl(b){
  try{
    const s=JSON.parse(localStorage.getItem('gaiheki_settings')||'{}');
    if(!s.customUrls)s.customUrls=[];
    const ex=s.customUrls.find(u=>u.id===b.id);
    if(ex){ex.label=b.label;ex.url=b.url;}
    else s.customUrls.push({id:b.id,label:b.label,url:b.url});
    localStorage.setItem('gaiheki_settings',JSON.stringify(s));
  }catch(e){}
}

/* ── Tabs ── */
function allPages(){return[...FIXED,...customs.map(c=>({id:c.id,name:c.name,editable:true,isCustom:true}))];}

function renderTabs(){
  document.getElementById('h-tabs').innerHTML=allPages().map(p=>{
    const ac=p.id===cur?' active':'', di=!p.editable?' disabled':'';
    const cl=`h-tab${ac}${di}${p.isCustom?' custom-tab':''}`;
    const xb=p.isCustom?`<span class="tab-x" onclick="removePage('${p.id}',event)">×</span>`:'';
    const oc=p.editable?`onclick="switchPage('${p.id}')"`:'' ;
    return `<button class="${cl}" ${oc}>${esc(p.name)}${xb}</button>`;
  }).join('');
}

function switchPage(id){cur=id;renderTabs();renderEditor();renderPreview();}

/* ── Preview ── */
function renderPreview(){
  const pc=document.getElementById('preview-content');
  const page=allPages().find(p=>p.id===cur);
  if(!page||!page.editable){
    pc.innerHTML='<div class="pv-unavail">このページのプレビューは表示できません</div>';
    return;
  }
  const bs=(pages[cur]||{}).blocks||[];
  if(!bs.length){pc.innerHTML='<div class="pv-unavail" style="color:#bbb">ブロックがありません。右ペインから追加してください。</div>';return;}
  pc.innerHTML='<div class="pv-inner">'+blocks2html(bs)+'</div>';
}

/* ── Editor ── */
function getBlocks(){return(pages[cur]||{blocks:[]}).blocks;}
function setBlocks(a){if(!pages[cur])pages[cur]={blocks:[]};pages[cur].blocks=a;}

function previewText(b){
  switch(b.type){
    case 'sh':case 'heading':case 'highlight':return b.text||'';
    case 'k-v':return (b.label||'')+(b.value?'　'+b.value:'');
    case 'k-v-k-v':return (b.label1||'')+(b.label2?' / '+b.label2:'');
    case 'note-row':case 'body':case 'bold':case 'note':return (b.text||'').replace(/\n/g,' ');
    case 'url-block':return (b.label||'')+(b.url?' → '+b.url:'');
    case 'spacer':return '余白（'+(b.size||'md')+')';
    default:return '';
  }
}

function renderEditor(){
  const page=allPages().find(p=>p.id===cur);
  const nm=document.getElementById('non-edit-msg');
  const bl=document.getElementById('block-list');
  const ab=document.getElementById('btn-add-block');
  if(!page||!page.editable){nm.style.display='';bl.style.display='none';ab.style.display='none';return;}
  nm.style.display='none';bl.style.display='';ab.style.display='';
  const bs=getBlocks();
  bl.innerHTML=bs.map((b,i)=>renderCard(b,i,bs.length)).join('');
  bl.querySelectorAll('.block-card').forEach(card=>{
    card.addEventListener('dragstart',()=>{dragFrom=+card.dataset.i;card.classList.add('dragging');});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');bl.querySelectorAll('.block-card').forEach(c=>c.classList.remove('drag-over'));});
    card.addEventListener('dragover',e=>{e.preventDefault();card.classList.add('drag-over');});
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drag-over');dropBlock(+card.dataset.i);});
  });
}

function renderCard(b,i,total){
  const def=BT.find(t=>t.type===b.type)||{label:b.type,bb:'#888',bg:'#fff'};
  const badge=`<span class="bc-badge" style="background:${def.bb};color:${def.bg}">${def.label}</span>`;
  const prev=esc(previewText(b));
  const upd=i===0?' disabled':'', dnd=i===total-1?' disabled':'';
  return `<div class="block-card" draggable="true" data-i="${i}">
    <div class="bc-head">
      <span class="bc-drag">⠿</span>${badge}
      <span class="bc-prev">${prev}</span>
      <button class="bc-btn" onclick="moveBlock(${i},-1)"${upd}>↑</button>
      <button class="bc-btn" onclick="moveBlock(${i},1)"${dnd}>↓</button>
      <button class="bc-btn" onclick="openEdit(${i})">編集</button>
      <button class="bc-btn del" onclick="delBlock(${i})">削除</button>
    </div>
  </div>`;
}

/* ── Block ops ── */
function moveBlock(i,d){
  const a=[...getBlocks()],ni=i+d;
  if(ni<0||ni>=a.length)return;
  [a[i],a[ni]]=[a[ni],a[i]]; setBlocks(a); renderEditor();renderPreview();
}
function delBlock(i){
  const a=[...getBlocks()]; a.splice(i,1); setBlocks(a); renderEditor();renderPreview();
}
function dropBlock(to){
  if(dragFrom<0||dragFrom===to)return;
  const a=[...getBlocks()],[item]=a.splice(dragFrom,1);
  a.splice(to,0,item); setBlocks(a); dragFrom=-1; renderEditor();renderPreview();
}

/* ── Add modal ── */
function openAddModal(){
  document.getElementById('type-grid').innerHTML=BT.map(t=>
    `<button class="type-btn" onclick="selectType('${t.type}')">
      <span class="tbl" style="color:${t.bb==='#e0e0e0'?'#666':t.bb}">${t.label}</span>
      <span class="tbd">${t.desc}</span>
    </button>`
  ).join('');
  showModal('add-modal');
}

function selectType(type){
  newType=type; editIdx=-1; isNewBlock=true;
  closeModals(); openEdit(-1,type);
}

/* ── Edit modal ── */
function openEdit(idx,forcedType){
  editIdx=idx; isNewBlock=idx<0;
  const b=isNewBlock?{type:forcedType||'body'}:getBlocks()[idx];
  const def=BT.find(t=>t.type===b.type)||{label:'ブロック',fields:[]};
  document.getElementById('edit-modal-title').textContent=isNewBlock?'ブロックを追加':'ブロックを編集';
  document.getElementById('edit-modal-body').innerHTML=buildForm(b,def);
  showModal('edit-modal');
}

function buildForm(b,def){
  if(b.type==='spacer'){
    const c=b.size||'md';
    return `<label class="m-lbl">サイズ</label>
    <select class="m-sel" id="ef-size">
      <option value="sm"${c==='sm'?' selected':''}>小（16px）</option>
      <option value="md"${c==='md'?' selected':''}>中（32px）</option>
      <option value="lg"${c==='lg'?' selected':''}>大（64px）</option>
    </select>`;
  }
  return (def.fields||[]).map(f=>{
    const v=esc(b[f.k]||'');
    const inp=f.ml
      ?`<textarea class="m-ta" id="ef-${f.k}">${v}</textarea>`
      :`<input class="m-inp" id="ef-${f.k}" type="text" value="${v}"${f.ph?` placeholder="${esc(f.ph)}"`:''}>`;
    return `<label class="m-lbl">${f.l}</label>${inp}`;
  }).join('');
}

function confirmEdit(){
  const type=isNewBlock?newType:getBlocks()[editIdx].type;
  const def=BT.find(t=>t.type===type)||{fields:[]};
  const block={id:isNewBlock?uid():(getBlocks()[editIdx]?.id||uid()),type};
  if(type==='spacer'){block.size=document.getElementById('ef-size').value;}
  else{(def.fields||[]).forEach(f=>{const el=document.getElementById('ef-'+f.k);if(el)block[f.k]=el.value;});}
  const a=[...getBlocks()];
  if(isNewBlock)a.push(block); else a[editIdx]=block;
  setBlocks(a); closeModals(); renderEditor();renderPreview();
}

/* ── Custom pages ── */
function openAddPageModal(){showModal('addp-modal');document.getElementById('new-page-name').value='';}
function addCustomPage(){
  const name=document.getElementById('new-page-name').value.trim();
  if(!name)return;
  const id='custom_'+Date.now();
  customs.push({id,name}); pages[id]={blocks:[]};
  closeModals(); switchPage(id);
}
function removePage(id,e){
  e.stopPropagation();
  if(!confirm('このページを削除しますか？'))return;
  customs=customs.filter(c=>c.id!==id); delete pages[id];
  if(cur===id)switchPage('p1'); else renderTabs();
}

/* ── Modals ── */
function showModal(id){document.getElementById('ov').style.display='block';document.getElementById(id).style.display='block';}
function closeModals(){document.getElementById('ov').style.display='none';['add-modal','edit-modal','addp-modal'].forEach(id=>document.getElementById(id).style.display='none');}

/* ── Init ── */
load(); renderTabs(); renderEditor(); renderPreview();
</script>
