<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gaiheki+ ガイダンスエディタ</title>
<style>
:root {
  --main:   #3F3277;
  --bg:     #F3F3F3;
  --text:   #1a1a1a;
  --white:  #ffffff;
  --border: #d0d0d0;
  --label:  #555555;
  --muted:  #999999;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}

/* ── Header ── */
.header {
  height: 56px; background: var(--white); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 8px; flex-shrink: 0;
  overflow-x: auto;
}
.h-logo {
  font-size: 17px; font-weight: 800; color: var(--main); text-decoration: none;
  white-space: nowrap; flex-shrink: 0; letter-spacing: -.5px;
}
.h-divider { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
.h-tabs { display: flex; gap: 4px; flex-shrink: 0; }
.h-tab {
  padding: 5px 12px; border-radius: 4px; border: 1px solid var(--border);
  background: none; font-size: 12px; color: var(--label); cursor: pointer;
  transition: all .12s; white-space: nowrap; font-family: inherit;
}
.h-tab.active { background: var(--main); color: var(--white); border-color: var(--main); font-weight: 600; }
.h-tab:hover:not(.active):not(.disabled) { border-color: var(--main); color: var(--main); }
.h-tab.disabled { opacity: 0.45; cursor: default; }
.btn-add-page {
  padding: 5px 10px; border: 1px dashed var(--border); border-radius: 4px;
  background: none; font-size: 12px; color: var(--label); cursor: pointer;
  white-space: nowrap; font-family: inherit; transition: all .12s; flex-shrink: 0;
}
.btn-add-page:hover { border-color: var(--main); color: var(--main); }
.h-spacer { flex: 1; min-width: 8px; }
.btn-save {
  padding: 7px 20px; background: var(--main); color: var(--white); border: none;
  border-radius: 4px; font-size: 13px; font-weight: 700; cursor: pointer;
  white-space: nowrap; font-family: inherit; flex-shrink: 0;
}
.btn-save:hover { opacity: .85; }

/* ── Main layout ── */
.main { flex: 1; display: flex; overflow: hidden; }

/* ── Preview pane ── */
.preview-pane {
  width: 60%; overflow: auto; background: #d0d0d0;
  padding: 20px; display: flex; align-items: flex-start; justify-content: center;
  flex-shrink: 0;
}
.a4-wrap { width: 794px; background: var(--white); box-shadow: 0 2px 10px rgba(0,0,0,.2); }
.page-hbar {
  background: #3F3277; color: #fff; padding: 13px 32px;
  display: flex; justify-content: space-between; align-items: center;
}
.page-hbar-brand { font-size: 17px; font-weight: 800; letter-spacing: -.5px; }
.page-content { padding: 10px 32px 24px; }
#preview-content { font-size: 11.5px; color: #555; line-height: 1.9; }
.preview-unavail {
  display: flex; align-items: center; justify-content: center;
  height: 200px; color: var(--muted); font-size: 13px;
}

/* ── Editor pane ── */
.editor-pane {
  width: 40%; overflow-y: auto; padding: 16px 20px;
  background: var(--bg); border-left: 1px solid var(--border);
}
.editor-unavail {
  margin: 40px auto; text-align: center; color: var(--muted);
  font-size: 13px; background: #ebebeb; padding: 24px 32px; border-radius: 8px;
}

/* ── Block cards ── */
.block-card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 6px; margin-bottom: 8px; overflow: hidden;
}
.block-card.dragging { opacity: .4; box-shadow: 0 6px 16px rgba(0,0,0,.15); }
.block-card.drag-over { border-color: var(--main); box-shadow: 0 0 0 2px rgba(63,50,119,.2); background: #faf9ff; }
.bc-head {
  display: flex; align-items: center; gap: 8px; padding: 9px 12px;
  min-height: 40px;
}
.bc-drag {
  font-size: 16px; color: #ccc; cursor: grab; flex-shrink: 0;
  padding: 1px 4px; border-radius: 3px; transition: color .1s; line-height: 1;
}
.bc-drag:hover { color: var(--main); background: #ede9f6; }
.bc-badge {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 3px;
  white-space: nowrap; flex-shrink: 0;
}
.bc-preview {
  flex: 1; font-size: 11px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
.bc-btn {
  padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px;
  background: none; font-size: 11px; color: var(--label); cursor: pointer;
  font-family: inherit; flex-shrink: 0; transition: all .1s;
}
.bc-btn:hover { border-color: var(--main); color: var(--main); }
.bc-del { background: #ffeaea !important; color: #e53935 !important; border-color: #ffd0d0 !important; }
.bc-del:hover { background: #ffcdd2 !important; border-color: #e53935 !important; }

.btn-add-block {
  width: 100%; padding: 11px; background: none; border: 1px dashed var(--border);
  border-radius: 6px; color: var(--label); font-size: 13px; cursor: pointer;
  font-family: inherit; transition: all .12s; margin-top: 4px;
}
.btn-add-block:hover { border-color: var(--main); color: var(--main); background: #f7f6fb; }

/* ── Toast ── */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px);
  background: #1a1a1a; color: var(--white); padding: 11px 28px; border-radius: 6px;
  font-size: 13px; font-weight: 500; opacity: 0; transition: opacity .25s, transform .25s;
  pointer-events: none; z-index: 9999;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Modals ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.modal-overlay.hidden { display: none; }
.modal-box {
  background: var(--white); border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,.22); width: 100%; max-width: 560px;
  max-height: 90vh; overflow-y: auto;
}
.modal-box.wide { max-width: 620px; }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.modal-head h2 { font-size: 15px; font-weight: 700; }
.modal-close {
  border: none; background: none; font-size: 20px; color: var(--muted);
  cursor: pointer; line-height: 1; padding: 0 4px;
}
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px; }
.modal-foot {
  display: flex; gap: 10px; justify-content: flex-end;
  padding: 14px 20px; border-top: 1px solid var(--border);
}
.btn-cancel {
  padding: 8px 18px; border: 1px solid var(--border); border-radius: 4px;
  background: none; color: var(--label); font-size: 13px; cursor: pointer; font-family: inherit;
}
.btn-cancel:hover { border-color: var(--main); color: var(--main); }
.btn-primary {
  padding: 8px 20px; background: var(--main); color: var(--white);
  border: none; border-radius: 4px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.btn-primary:hover { opacity: .85; }

/* Type grid in add modal */
.type-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.type-btn {
  border: 1px solid var(--border); border-radius: 6px; padding: 12px 10px;
  background: none; cursor: pointer; text-align: left; font-family: inherit;
  transition: all .12s;
}
.type-btn:hover { border-color: var(--main); background: #f7f6fb; }
.type-btn .tb-label { font-size: 12px; font-weight: 700; color: var(--text); display: block; margin-bottom: 4px; }
.type-btn .tb-desc { font-size: 10px; color: var(--muted); display: block; line-height: 1.4; }

/* Edit form fields */
.field-group { margin-bottom: 14px; }
.field-label { font-size: 11px; font-weight: 600; color: var(--label); display: block; margin-bottom: 5px; }
.field-input {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 4px; font-size: 13px; font-family: inherit; background: var(--white);
}
.field-input:focus { outline: none; border-color: var(--main); }
.field-textarea {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 4px; font-size: 13px; font-family: inherit; background: var(--white);
  resize: vertical; min-height: 72px; line-height: 1.5;
}
.field-textarea:focus { outline: none; border-color: var(--main); }
.field-select {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 4px; font-size: 13px; font-family: inherit; background: var(--white);
  cursor: pointer;
}
.field-select:focus { outline: none; border-color: var(--main); }

/* doc-table used in create.html compat */
.doc-table { width: 100%; border-collapse: collapse; }
.doc-table td { border: 1px solid var(--border); vertical-align: top; padding: 7px 12px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <a class="h-logo" href="gaiheki-setting.html">gaiheki+</a>
  <div class="h-divider"></div>
  <div class="h-tabs" id="tab-bar">
    <!-- rendered by JS -->
  </div>
  <button class="btn-add-page" onclick="openAddPageModal()">＋ ページ追加</button>
  <div class="h-spacer"></div>
  <button class="btn-save" onclick="saveData()">保存</button>
</div>

<!-- Main -->
<div class="main">
  <!-- Preview -->
  <div class="preview-pane">
    <div class="a4-wrap">
      <div class="page-hbar">
        <span class="page-hbar-brand">gaiheki+</span>
        <span style="font-size:11px;opacity:.75">プレビュー</span>
      </div>
      <div class="page-content">
        <div id="preview-content"></div>
      </div>
    </div>
  </div>

  <!-- Editor -->
  <div class="editor-pane" id="editor-pane">
    <div id="editor-body"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Modal: Add block type -->
<div class="modal-overlay hidden" id="modal-add-type">
  <div class="modal-box wide">
    <div class="modal-head">
      <h2>ブロックを追加</h2>
      <button class="modal-close" onclick="closeModal('modal-add-type')">✕</button>
    </div>
    <div class="modal-body">
      <div class="type-grid" id="type-grid"></div>
    </div>
  </div>
</div>

<!-- Modal: Edit block -->
<div class="modal-overlay hidden" id="modal-edit-block">
  <div class="modal-box">
    <div class="modal-head">
      <h2>ブロックを編集</h2>
      <button class="modal-close" onclick="closeModal('modal-edit-block')">✕</button>
    </div>
    <div class="modal-body" id="edit-form-body"></div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal('modal-edit-block')">キャンセル</button>
      <button class="btn-primary" onclick="saveEditModal()">保存</button>
    </div>
  </div>
</div>

<!-- Modal: Add custom page -->
<div class="modal-overlay hidden" id="modal-add-page">
  <div class="modal-box" style="max-width:400px">
    <div class="modal-head">
      <h2>ページを追加</h2>
      <button class="modal-close" onclick="closeModal('modal-add-page')">✕</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label class="field-label">ページ名</label>
        <input class="field-input" id="new-page-name" type="text" placeholder="例：追加資料">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal('modal-add-page')">キャンセル</button>
      <button class="btn-primary" onclick="confirmAddPage()">追加</button>
    </div>
  </div>
</div>

<script>
/* ======================================================
   DATA DEFINITIONS
====================================================== */
var FIXED_PAGES = [
  { id: 'p1',       name: 'ご確認事項',                     editable: true },
  { id: 'p-manual', name: '管理画面の使い方',                editable: false },
  { id: 'p2',       name: '写真ご提供のお願い',              editable: true },
  { id: 'p3',       name: '現調 / 成約に繋げるための施策',   editable: true },
  { id: 'p4',       name: 'CS担当者',                       editable: false },
];

var BLOCK_TYPES = [
  { type: 'table-title',  label: 'テーブルタイトル',  badgeBg:'#3F3277', badgeColor:'#fff',
    desc:'紫背景・白文字のセクション見出し',
    fields:[{key:'text', label:'テキスト'}] },
  { type: 'table-key',    label: 'テーブル内訳',      badgeBg:'#607D8B', badgeColor:'#fff',
    desc:'グレー背景の行（ラベル＋値）',
    fields:[{key:'label',label:'ラベル'},{key:'value',label:'値',multiline:true}] },
  { type: 'table-detail', label: 'テーブル詳細',      badgeBg:'#90A4AE', badgeColor:'#fff',
    desc:'白背景の行（ラベル＋値）',
    fields:[{key:'label',label:'ラベル'},{key:'value',label:'値',multiline:true}] },
  { type: 'table-2col',   label: 'テーブル2列',       badgeBg:'#546E7A', badgeColor:'#fff',
    desc:'横並び2列（ラベル＋値 × 2）',
    fields:[{key:'label1',label:'ラベル1'},{key:'value1',label:'値1'},{key:'label2',label:'ラベル2'},{key:'value2',label:'値2'}] },
  { type: 'heading',      label: 'タイトル',          badgeBg:'#1a1a1a', badgeColor:'#fff',
    desc:'ページ内の大見出し',
    fields:[{key:'text',label:'テキスト'}] },
  { type: 'body',         label: '本文',              badgeBg:'#757575', badgeColor:'#fff',
    desc:'通常テキスト（改行・**太字**対応）',
    fields:[{key:'text',label:'テキスト',multiline:true}] },
  { type: 'bold',         label: '太字',              badgeBg:'#424242', badgeColor:'#fff',
    desc:'太字テキスト',
    fields:[{key:'text',label:'テキスト',multiline:true}] },
  { type: 'highlight',    label: '背景ありテキスト',  badgeBg:'#e8e6f3', badgeColor:'#3d3580',
    desc:'薄紫背景・紫文字のラベル',
    fields:[{key:'text',label:'テキスト'}] },
  { type: 'note',         label: '補足テキスト',      badgeBg:'#f5f5f5', badgeColor:'#888',
    desc:'グレー小文字（※〜）',
    fields:[{key:'text',label:'テキスト',multiline:true}] },
  { type: 'spacer',       label: '余白',              badgeBg:'#e0e0e0', badgeColor:'#666',
    desc:'上下の空白', isSpecial:true },
  { type: 'url-block',    label: 'URLブロック',       badgeBg:'#1565C0', badgeColor:'#fff',
    desc:'ラベル＋URL',
    fields:[{key:'label',label:'ラベルテキスト'},{key:'url',label:'URL',placeholder:'https://...'}] },
];

var STORAGE_KEY = 'gaiheki_editor_pages';

/* ======================================================
   STATE
====================================================== */
var pageData     = {};  // { p1: { blocks:[] }, p2: { blocks:[] }, ... }
var customPages  = [];  // [{ id:'custom_123', name:'ページ名' }, ...]
var currentPageId = 'p1';

var dragSrcIdx = -1;

/* edit modal state */
var _editBlockIdx  = null;  // null = adding new block
var _editBlockType = null;
var _editTempBlock = null;  // working copy while modal open

/* ======================================================
   STORAGE HELPERS
====================================================== */
function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var parsed = JSON.parse(raw);
    if (parsed && parsed.pages) {
      pageData = parsed.pages;
      // extract custom pages
      customPages = [];
      Object.keys(parsed.pages).forEach(function(id) {
        var isFixed = FIXED_PAGES.some(function(fp){ return fp.id === id; });
        if (!isFixed) {
          var pg = parsed.pages[id];
          customPages.push({ id: id, name: pg.name || id });
        }
      });
    }
  } catch(e) {
    console.warn('[Editor] load error:', e);
  }
}

function saveData() {
  // sync url-blocks
  var allPageIds = getAllPageIds();
  allPageIds.forEach(function(pid) {
    var pg = pageData[pid];
    if (!pg || !pg.blocks) return;
    pg.blocks.forEach(function(b) {
      if (b.type === 'url-block') syncUrlBlock(b);
    });
  });

  var toSave = { pages: pageData };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  showToast('保存しました');
}

function syncUrlBlock(block) {
  if (!block.url) return;
  try {
    var settings = JSON.parse(localStorage.getItem('gaiheki_settings') || '{}');
    if (!settings.customUrls) settings.customUrls = [];
    var existing = settings.customUrls.find(function(u){ return u.id === block.id; });
    if (existing) { existing.label = block.label; existing.url = block.url; }
    else { settings.customUrls.push({ id: block.id, label: block.label, url: block.url }); }
    localStorage.setItem('gaiheki_settings', JSON.stringify(settings));
  } catch(e) {}
}

function getAllPageIds() {
  var ids = FIXED_PAGES.map(function(p){ return p.id; });
  customPages.forEach(function(cp){ ids.push(cp.id); });
  return ids;
}

function ensurePage(pid, name) {
  if (!pageData[pid]) {
    pageData[pid] = { blocks: [] };
    if (name) pageData[pid].name = name;
  }
}

/* ======================================================
   RENDERING HELPERS
====================================================== */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function proc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
}

var TABLE_TYPES = ['table-title','table-key','table-detail','table-2col'];

function blockToPreviewHTML(b) {
  switch(b.type) {
    case 'table-title':
      return '<tr><td colspan="4" style="background:#3F3277;color:#fff;padding:7px 14px;font-weight:700;font-size:12px">'+esc(b.text)+'</td></tr>';
    case 'table-key':
      return '<tr><td style="background:#f7f6fb;color:#555;font-size:11px;padding:7px 12px;border:1px solid #e0e0e0;width:180px;vertical-align:middle">'+esc(b.label)+'</td><td colspan="3" style="padding:7px 12px;border:1px solid #e0e0e0;vertical-align:middle">'+proc(b.value)+'</td></tr>';
    case 'table-detail':
      return '<tr><td style="padding:7px 12px;border:1px solid #e0e0e0;font-size:11px;width:180px">'+esc(b.label)+'</td><td colspan="3" style="padding:7px 12px;border:1px solid #e0e0e0">'+proc(b.value)+'</td></tr>';
    case 'table-2col':
      return '<tr>'
        +'<td style="background:#f7f6fb;color:#555;font-size:11px;padding:7px 12px;border:1px solid #e0e0e0;width:140px">'+esc(b.label1)+'</td>'
        +'<td style="padding:7px 12px;border:1px solid #e0e0e0">'+proc(b.value1)+'</td>'
        +'<td style="background:#f7f6fb;color:#555;font-size:11px;padding:7px 12px;border:1px solid #e0e0e0;width:140px">'+esc(b.label2)+'</td>'
        +'<td style="padding:7px 12px;border:1px solid #e0e0e0">'+proc(b.value2)+'</td>'
        +'</tr>';
    case 'heading':
      return '<div style="font-size:18px;font-weight:700;color:#1a1a1a;margin:20px 0 10px;border-bottom:2px solid #3F3277;padding-bottom:6px">'+esc(b.text)+'</div>';
    case 'body':
      return '<div style="margin-bottom:8px">'+proc(b.text)+'</div>';
    case 'bold':
      return '<div style="font-weight:700;margin-bottom:8px">'+proc(b.text)+'</div>';
    case 'highlight':
      return '<span style="display:inline-block;background:#e8e6f3;color:#3d3580;padding:3px 10px;border-radius:3px;font-weight:700;margin-bottom:4px">'+esc(b.text)+'</span><br>';
    case 'note':
      return '<div style="font-size:11px;color:#888;margin-bottom:6px">'+proc(b.text)+'</div>';
    case 'spacer':
      var h = {sm:16,md:32,lg:64}[b.size||'md'];
      return '<div style="height:'+h+'px;background:repeating-linear-gradient(90deg,#f0f0f0 0,#f0f0f0 4px,transparent 4px,transparent 12px);opacity:.5"></div>';
    case 'url-block':
      return '<div style="margin-bottom:10px">'+esc(b.label)+'<br><a style="color:#3F3277;text-decoration:underline;word-break:break-all">'+( esc(b.url) || '（URL未設定）' )+'</a></div>';
    default: return '';
  }
}

function renderBlocksToHTML(blocks) {
  var parts = [];
  var tableRows = [];
  function flushTable() {
    if (tableRows.length) {
      parts.push('<table style="width:100%;border-collapse:collapse;margin-bottom:14px">'+tableRows.join('')+'</table>');
      tableRows = [];
    }
  }
  (blocks||[]).forEach(function(b) {
    if (TABLE_TYPES.indexOf(b.type) >= 0) {
      tableRows.push(blockToPreviewHTML(b));
    } else {
      flushTable();
      parts.push(blockToPreviewHTML(b));
    }
  });
  flushTable();
  return parts.join('');
}

/* ======================================================
   TABS
====================================================== */
function renderTabs() {
  var bar = document.getElementById('tab-bar');
  if (!bar) return;
  var html = '';
  FIXED_PAGES.forEach(function(fp) {
    var isActive = currentPageId === fp.id;
    var cls = 'h-tab' + (isActive ? ' active' : '') + (!fp.editable ? ' disabled' : '');
    var click = fp.editable ? ' onclick="switchPage(\'' + fp.id + '\')"' : '';
    html += '<button class="'+cls+'"'+click+'>'+esc(fp.name)+'</button>';
  });
  customPages.forEach(function(cp) {
    var isActive = currentPageId === cp.id;
    var cls = 'h-tab' + (isActive ? ' active' : '');
    html += '<button class="'+cls+'" onclick="switchPage(\''+escId(cp.id)+'\')">'+esc(cp.name)
      +'<span onclick="event.stopPropagation();removeCustomPage(\''+escId(cp.id)+'\')" style="margin-left:6px;opacity:.6;font-size:9px" title="削除">✕</span>'
      +'</button>';
  });
  bar.innerHTML = html;
}

function switchPage(pid) {
  if (pid === currentPageId) return;
  currentPageId = pid;
  renderTabs();
  renderAll();
}

/* ======================================================
   PREVIEW
====================================================== */
function renderPreview() {
  var el = document.getElementById('preview-content');
  if (!el) return;
  var fp = FIXED_PAGES.find(function(p){ return p.id === currentPageId; });
  if (fp && !fp.editable) {
    el.innerHTML = '<div class="preview-unavail">このページのプレビューは表示できません</div>';
    return;
  }
  var pg = pageData[currentPageId];
  var blocks = pg ? (pg.blocks || []) : [];
  el.innerHTML = renderBlocksToHTML(blocks);
}

/* ======================================================
   EDITOR
====================================================== */
function escId(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function blockTypeInfo(type) {
  return BLOCK_TYPES.find(function(t){ return t.type === type; }) || null;
}

function blockPreviewText(b) {
  if (b.type === 'spacer') return '余白（' + ({sm:'小',md:'中',lg:'大'}[b.size||'md']||'中') + '）';
  if (b.type === 'table-2col') return [b.label1, b.label2].filter(Boolean).join(' | ') || '（空）';
  if (b.type === 'table-key' || b.type === 'table-detail') return esc(b.label || b.value || '（空）');
  if (b.type === 'url-block') return esc(b.label || b.url || '（未設定）');
  return esc((b.text || '（空）').replace(/\n/g,' ').replace(/\*\*/g,'').substring(0, 50));
}

function buildBlockCard(b, idx) {
  var ti = blockTypeInfo(b.type);
  var badgeBg    = ti ? ti.badgeBg    : '#e0e0e0';
  var badgeColor = ti ? ti.badgeColor : '#666';
  var label      = ti ? ti.label      : b.type;
  var pre        = blockPreviewText(b);

  var card = '<div class="block-card" draggable="true" data-idx="'+idx+'"'
    +' ondragstart="onDragStart(event)" ondragend="onDragEnd(event)"'
    +' ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">'
    +'<div class="bc-head">'
    +'<span class="bc-drag" title="ドラッグで並び替え">⠿</span>'
    +'<span class="bc-badge" style="background:'+badgeBg+';color:'+badgeColor+'">'+esc(label)+'</span>'
    +'<span class="bc-preview">'+pre+'</span>'
    +'<button class="bc-btn" onclick="moveBlock('+idx+',-1)">↑</button>'
    +'<button class="bc-btn" onclick="moveBlock('+idx+',1)">↓</button>'
    +'<button class="bc-btn" onclick="openEditModal('+idx+')">編集</button>'
    +'<button class="bc-btn bc-del" onclick="deleteBlock('+idx+')">削除</button>'
    +'</div>'
    +'</div>';
  return card;
}

function renderEditor() {
  var body = document.getElementById('editor-body');
  if (!body) return;

  var fp = FIXED_PAGES.find(function(p){ return p.id === currentPageId; });
  if (fp && !fp.editable) {
    body.innerHTML = '<div class="editor-unavail">このページは編集できません</div>';
    return;
  }

  ensurePage(currentPageId);
  var blocks = pageData[currentPageId].blocks || [];
  var html = '<div id="block-list">';
  blocks.forEach(function(b, i) { html += buildBlockCard(b, i); });
  html += '</div>';
  html += '<button class="btn-add-block" id="btn-add-block" onclick="openAddTypeModal()">＋ ブロックを追加</button>';
  body.innerHTML = html;
}

function renderAll() {
  renderPreview();
  renderEditor();
}

/* ======================================================
   BLOCK OPERATIONS
====================================================== */
function currentBlocks() {
  ensurePage(currentPageId);
  return pageData[currentPageId].blocks || (pageData[currentPageId].blocks = []);
}

function moveBlock(idx, dir) {
  var arr = currentBlocks();
  var newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= arr.length) return;
  var tmp = arr[idx]; arr[idx] = arr[newIdx]; arr[newIdx] = tmp;
  renderAll();
}

function deleteBlock(idx) {
  if (!confirm('このブロックを削除しますか？')) return;
  currentBlocks().splice(idx, 1);
  renderAll();
}

/* ======================================================
   ADD TYPE MODAL
====================================================== */
function openAddTypeModal() {
  var grid = document.getElementById('type-grid');
  grid.innerHTML = BLOCK_TYPES.map(function(t) {
    return '<button class="type-btn" onclick="selectBlockType(\''+t.type+'\')">'
      +'<span class="tb-label">'+esc(t.label)+'</span>'
      +'<span class="tb-desc">'+esc(t.desc)+'</span>'
      +'</button>';
  }).join('');
  openModal('modal-add-type');
}

function selectBlockType(type) {
  closeModal('modal-add-type');
  var ti = blockTypeInfo(type);
  if (!ti) return;
  // build blank block
  var blank = { id: 'b_' + Date.now(), type: type };
  if (ti.fields) {
    ti.fields.forEach(function(f) { blank[f.key] = ''; });
  }
  if (type === 'spacer') blank.size = 'md';
  _editBlockIdx  = null;  // null = new block
  _editBlockType = type;
  _editTempBlock = blank;
  renderEditForm();
  openModal('modal-edit-block');
}

/* ======================================================
   EDIT MODAL
====================================================== */
function openEditModal(idx) {
  var b = currentBlocks()[idx];
  if (!b) return;
  _editBlockIdx  = idx;
  _editBlockType = b.type;
  _editTempBlock = JSON.parse(JSON.stringify(b));
  renderEditForm();
  openModal('modal-edit-block');
}

function renderEditForm() {
  var container = document.getElementById('edit-form-body');
  if (!container) return;
  var b  = _editTempBlock;
  var ti = blockTypeInfo(b.type);
  var html = '';

  if (b.type === 'spacer') {
    html += '<div class="field-group">'
      +'<label class="field-label">サイズ</label>'
      +'<select class="field-select" id="ef-spacer-size">'
      +['sm','md','lg'].map(function(sz) {
        var lbl = {sm:'小（16px）',md:'中（32px）',lg:'大（64px）'}[sz];
        return '<option value="'+sz+'"'+((b.size||'md')===sz?' selected':'')+'>'+lbl+'</option>';
      }).join('')
      +'</select>'
      +'</div>';
  } else if (ti && ti.fields) {
    ti.fields.forEach(function(f) {
      var val = esc(b[f.key] || '');
      html += '<div class="field-group">'
        +'<label class="field-label">'+esc(f.label)+'</label>';
      if (f.multiline) {
        html += '<textarea class="field-textarea" id="ef-'+f.key+'" rows="4">'+val+'</textarea>';
      } else {
        var ph = f.placeholder ? ' placeholder="'+esc(f.placeholder)+'"' : '';
        html += '<input class="field-input" id="ef-'+f.key+'" type="text" value="'+val+'"'+ph+'>';
      }
      html += '</div>';
    });
  }

  container.innerHTML = html;
}

function saveEditModal() {
  var b  = _editTempBlock;
  var ti = blockTypeInfo(b.type);

  if (b.type === 'spacer') {
    var sel = document.getElementById('ef-spacer-size');
    if (sel) b.size = sel.value;
  } else if (ti && ti.fields) {
    ti.fields.forEach(function(f) {
      var el = document.getElementById('ef-' + f.key);
      if (el) b[f.key] = el.value;
    });
  }

  var arr = currentBlocks();
  if (_editBlockIdx === null) {
    // new block
    arr.push(b);
  } else {
    arr[_editBlockIdx] = b;
  }

  // sync url-block immediately
  if (b.type === 'url-block') syncUrlBlock(b);

  closeModal('modal-edit-block');
  renderAll();
}

/* ======================================================
   DRAG AND DROP
====================================================== */
function onDragStart(e) {
  dragSrcIdx = parseInt(e.currentTarget.dataset.idx);
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(dragSrcIdx));
  setTimeout(function() { e.currentTarget.classList.add('dragging'); }, 0);
}

function onDragEnd(e) {
  dragSrcIdx = -1;
  document.querySelectorAll('.block-card').forEach(function(c) {
    c.classList.remove('dragging', 'drag-over');
  });
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  var ti = parseInt(e.currentTarget.dataset.idx);
  document.querySelectorAll('.block-card').forEach(function(c) {
    c.classList.toggle('drag-over', parseInt(c.dataset.idx) === ti && ti !== dragSrcIdx);
  });
}

function onDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove('drag-over');
  }
}

function onDrop(e) {
  e.preventDefault();
  var ti = parseInt(e.currentTarget.dataset.idx);
  if (dragSrcIdx < 0 || dragSrcIdx === ti) { dragSrcIdx = -1; return; }
  var arr   = currentBlocks();
  var moved = arr.splice(dragSrcIdx, 1)[0];
  arr.splice(ti > dragSrcIdx ? ti - 1 : ti, 0, moved);
  dragSrcIdx = -1;
  renderAll();
}

/* ======================================================
   CUSTOM PAGE MANAGEMENT
====================================================== */
function openAddPageModal() {
  var inp = document.getElementById('new-page-name');
  if (inp) inp.value = '';
  openModal('modal-add-page');
  setTimeout(function() { if (inp) inp.focus(); }, 80);
}

function confirmAddPage() {
  var inp = document.getElementById('new-page-name');
  var name = inp ? inp.value.trim() : '';
  if (!name) { alert('ページ名を入力してください'); return; }
  var id = 'custom_' + Date.now();
  customPages.push({ id: id, name: name });
  ensurePage(id, name);
  closeModal('modal-add-page');
  switchPage(id);
}

function removeCustomPage(id) {
  var cp = customPages.find(function(p){ return p.id === id; });
  if (!cp) return;
  if (!confirm('「'+cp.name+'」を削除しますか？')) return;
  customPages = customPages.filter(function(p){ return p.id !== id; });
  delete pageData[id];
  if (currentPageId === id) currentPageId = 'p1';
  renderTabs();
  renderAll();
}

/* ======================================================
   MODAL HELPERS
====================================================== */
function openModal(id) {
  var el = document.getElementById(id);
  if (el) el.classList.remove('hidden');
}
function closeModal(id) {
  var el = document.getElementById(id);
  if (el) el.classList.add('hidden');
}

// Close on overlay click
document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.classList.add('hidden');
  });
});

/* ======================================================
   TOAST
====================================================== */
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

/* ======================================================
   INIT
====================================================== */
document.addEventListener('DOMContentLoaded', function() {
  loadData();
  // ensure default pages exist
  ['p1','p2','p3'].forEach(function(id) { ensurePage(id); });
  currentPageId = 'p1';
  renderTabs();
  renderAll();
});
</script>
</body>
</html>
