<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おそうじ合衆国 ガイダンスエディタ</title>
<style>
:root {
  --main:   #2788E7;
  --action: #2788E7;
  --bg:     #F3F3F3;
  --text:   #1a1a1a;
  --white:  #ffffff;
  --border: #d0d0d0;
  --label:  #555555;
  --muted:  #999999;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ── ヘッダー ── */
.header { height: 56px; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0; }
.btn-back { font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 4px; }
.btn-back:hover { background: var(--bg); color: var(--action); }
.h-logo img { display: block; }
.h-divider { width: 1px; height: 18px; background: var(--border); }
.h-title { font-size: 13px; font-weight: 600; color: var(--label); flex: 1; }
.h-tabs { display: flex; gap: 4px; }
.h-tab { padding: 6px 14px; border-radius: 4px; border: 1px solid var(--border); background: none; font-size: 13px; color: var(--label); cursor: pointer; transition: all .12s; white-space: nowrap; }
.h-tab.active { background: var(--action); color: var(--white); border-color: var(--action); font-weight: 600; }
.h-tab:hover:not(.active) { border-color: var(--action); color: var(--action); }
.btn-reset { padding: 7px 14px; background: none; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; color: var(--label); cursor: pointer; transition: all .12s; white-space: nowrap; }
.btn-reset:hover { border-color: #e53935; color: #e53935; }
.btn-save { padding: 7px 20px; background: var(--action); color: var(--white); border: none; border-radius: 4px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn-save:hover { opacity: .85; }
.btn-save:disabled { opacity: .6; cursor: not-allowed; }

/* ── メインレイアウト ── */
.main { flex: 1; display: flex; overflow: hidden; }

/* ── プレビュー ── */
.preview-pane { width: 50%; overflow: auto; background: #d8d8d8; padding: 20px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
#preview-page-wrap { transform-origin: top center; }
.a4-page { width: 794px; min-height: 1123px; background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.page-hbar { background: var(--main); color: var(--white); padding: 13px 32px; display: flex; justify-content: space-between; align-items: center; }
.phb-brand { font-size: 17px; font-weight: 800; letter-spacing: -.5px; }
.page-content { padding: 10px 32px 24px; }
.preview-inner { max-width: 760px; margin: 0; font-size: 11.5px; color: var(--label); line-height: 1.9; padding: 0 8px; }

/* ── エディタペイン ── */
.editor-pane { width: 50%; overflow-y: auto; padding: 16px 20px; background: var(--bg); border-left: 1px solid var(--border); }
.editor-tabs-sticky { position: sticky; top: 0; z-index: 100; background: #ffffff; display: flex; gap: 4px; padding: 8px 20px; margin: 0 -20px 12px; border-bottom: 1px solid var(--border); }
.editor-tabs-sticky .h-tab { font-size: 12px; padding: 4px 12px; }
.editor-head { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 12px; }

/* ── ブロックカード ── */
.block-card { background: var(--white); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; overflow: hidden; }
.block-card.dragging { opacity: .45; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.block-card.drag-over { border-color: var(--action); box-shadow: 0 0 0 2px rgba(63,50,119,.2); background: #faf9ff; }

/* カードヘッダー */
.bc-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; user-select: none; min-height: 40px; }
.bc-head:hover { background: #faf9ff; }
.block-special .bc-head,
.block-special .bc-head:hover { cursor: default; background: transparent; }

/* ドラッグハンドル */
.bc-drag { font-size: 18px; color: #ccc; cursor: grab; flex-shrink: 0; line-height: 1; padding: 1px 4px; border-radius: 3px; transition: color .1s; }
.bc-drag:hover { color: var(--action); background: #ede9f6; }

/* バッジ・プレビュー */
.bc-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 3px; white-space: nowrap; flex-shrink: 0; }
.bc-preview { flex: 1; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.bc-arrow { font-size: 9px; color: var(--muted); flex-shrink: 0; padding: 0 2px; }
.btn-del { padding: 3px 9px; background: #ffeaea; color: #e53935; border: none; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
.btn-del:hover { opacity: .8; }

/* 特殊ブロック */
.block-special { background: #fafafa; }
.bc-special-tag { flex: 1; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* カードボディ */
.bc-body { padding: 10px 12px 12px; border-top: 1px solid #f0f0f0; }
.bc-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.bc-row-label { font-size: 11px; color: var(--muted); flex-shrink: 0; }
.bc-field-label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; margin-top: 8px; }
.bc-field-label:first-child { margin-top: 0; }
.bc-style-sel { flex: 1; max-width: 190px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; font-family: inherit; background: var(--white); cursor: pointer; }
.bc-style-sel:focus { outline: none; border-color: var(--action); }
.bc-textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; font-family: inherit; resize: vertical; min-height: 60px; line-height: 1.5; }
.bc-textarea:focus { outline: none; border-color: var(--action); }
.bc-space-sel { padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; font-family: inherit; background: var(--white); cursor: pointer; }
.bc-space-sel:focus { outline: none; border-color: var(--action); }

/* ロックURL行 */
.bc-lock-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.bc-lock-icon { font-size: 13px; flex-shrink: 0; }
.bc-url-locked { flex: 1; padding: 5px 9px; border: 1px solid var(--border); border-radius: 4px; font-size: 11px; font-family: inherit; background: #f5f5f5; color: var(--muted); cursor: not-allowed; }

/* ブロック追加ボタン */
.btn-add { width: 100%; padding: 11px; background: none; border: 1px dashed var(--border); border-radius: 6px; color: var(--label); font-size: 13px; cursor: pointer; transition: all .12s; margin-top: 4px; }
.btn-add:hover { border-color: var(--action); color: var(--action); background: #f7f6fb; }
/* ページ追加ボタン */
.btn-add-page { padding: 4px 10px; border: 1px dashed var(--border); border-radius: 4px; background: none; font-size: 12px; color: var(--label); cursor: pointer; transition: all .12s; white-space: nowrap; flex-shrink: 0; }
.btn-add-page:hover { border-color: var(--action); color: var(--action); }

/* トースト */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(8px); background: #1a1a1a; color: var(--white); padding: 11px 28px; border-radius: 6px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 999; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* ── P1テーブルプレビュー ── */
.doc-table{width:100%;border-collapse:collapse;table-layout:fixed;}
.doc-table td{border:1px solid var(--border);vertical-align:top;padding:8px 12px;}
.sh td{background:#EBF4FD;color:#2788E7;font-size:11.5px;font-weight:700;padding:8px 12px;border-top:1px solid var(--border)!important;border-left:1px solid var(--border)!important;letter-spacing:.02em;}
.k{background:var(--bg)!important;color:#2788E7!important;font-size:11.5px!important;font-weight:600!important;width:220px!important;min-width:220px!important;max-width:220px!important;vertical-align:middle!important;white-space:nowrap!important;padding:8px 20px!important;}
.v{background:var(--white);color:var(--text);font-size:11.5px;}
.sub-note{font-size:10px;color:var(--muted);margin-left:8px;font-weight:400;}
.note{font-size:11.5px;color:var(--label);line-height:1.75;}
</style>

<body>

<div class="header">
  <a href="osouji.html" class="h-logo" onclick="guardNav(event)"><img src="osouji-logo.png" alt="おそうじ合衆国" height="32"></a>
  <div style="flex:1"></div>

</div>

/* ── State ── */
var currentPage = 'p1';
var blocks      = { p2: [], p3: [] };
var db          = firebase.firestore();
db.settings({ ignoreUndefinedProperties: true });
var dragSrcIdx  = -1;
var expandedIds = {};   /* blockId -> true/false */
var isDirty = false;
var _originalBlocks = null;
var extraPages = []; // [{key:'p4', label:'P4 ページ名'}, ...]
function syncDirtyState() {
  isDirty = _originalBlocks !== null && JSON.stringify(blocks) !== _originalBlocks;
  var btn = document.getElementById('btn-save');
  if (btn && btn.textContent !== '保存中...') btn.disabled = !isDirty;
}
function markDirty() { setTimeout(syncDirtyState, 0); }
function clearDirty() {
  _originalBlocks = JSON.stringify(blocks);
  isDirty = false;
  var btn = document.getElementById('btn-save');
  if (btn) btn.disabled = true;
}

/* ── Plan data for P1 ── */
var _planTemplates = [], _planDetails = [], p1Plan = '';
function loadPlanData() {
  try {
    var ls=JSON.parse(localStorage.getItem(BIZ_ID+'_settings')||'{}');
    if (ls.planTemplates&&ls.planTemplates.length){_planTemplates=ls.planTemplates;_planDetails=ls.planDetails||[];refreshP1PlanSel();}
  } catch(e){}
  db.collection('settings').doc(BIZ_ID).get().then(function(doc){
    if (!doc.exists) return;
    var d=doc.data();
    if (d.planTemplates&&d.planTemplates.length){
      _planTemplates=d.planTemplates;_planDetails=d.planDetails||[];

/* ── Firestore ── */
function ensureP1Blocks(arr) {
  var defIds = DEFAULT_BLOCKS.p1.map(function(b){ return b.id; });
  DEFAULT_BLOCKS.p1.forEach(function(db){ if(!arr.some(function(b){return b.id===db.id;})) arr.push(JSON.parse(JSON.stringify(db))); });
  arr.sort(function(a,b){ var ai=defIds.indexOf(a.id),bi=defIds.indexOf(b.id); return(ai<0&&bi<0)?0:(ai<0?1:(bi<0?-1:ai-bi)); });
  return arr;
}
function migrateBlocks(arr) {
  return (arr||[]).map(function(b) {
    if (b.style === 'link') return Object.assign({}, b, { style:'body', text: b.url||b.text||'' });
    return b;
  });
}

function loadTemplate() {
  console.log('[Editor] loadTemplate 開始:', BIZ_ID);
  db.collection('templates').doc(BIZ_ID).get()
    .then(function(doc) {
      var def = JSON.parse(JSON.stringify(DEFAULT_BLOCKS));
      if (doc.exists && doc.data().blocks) {
        var s = doc.data().blocks;
        blocks = {
          p1: ensureP1Blocks(migrateBlocks((s.p1&&s.p1.length) ? s.p1 : def.p1)),
          p2: migrateBlocks((s.p2&&s.p2.length) ? s.p2 : def.p2),
          p3: migrateBlocks((s.p3&&s.p3.length) ? s.p3 : def.p3)
        };
        if (doc.data().extraPages) {
          extraPages = doc.data().extraPages;
          extraPages.forEach(function(p){ blocks[p.key] = migrateBlocks((s[p.key]&&s[p.key].length)?s[p.key]:[]); });
        } else { extraPages = []; }
      } else {
        blocks = { p1: JSON.parse(JSON.stringify(def.p1)), p2: JSON.parse(JSON.stringify(def.p2)), p3: JSON.parse(JSON.stringify(def.p3)) };
        extraPages = [];
      }
      renderExtraTabs();
      _originalBlocks = JSON.stringify(blocks);
      var _sb=document.getElementById('btn-save');if(_sb)_sb.disabled=true;
      renderAll(); scalePreview();
    })
    .catch(function(e) {
      console.error('[Editor]', e.message);
      blocks = JSON.parse(JSON.stringify(DEFAULT_BLOCKS));
      _originalBlocks = JSON.stringify(blocks);
      var _sb=document.getElementById('btn-save');if(_sb)_sb.disabled=true;
      renderAll(); scalePreview();
    });
}

function saveTemplate() {
  var user = firebase.auth().currentUser;
  if (!user) {
    console.error('[Editor] 保存失敗: 未認証');
    alert('認証が必要です。ページを再読み込みしてください。');

  }
  var btn = document.getElementById('btn-save');

  var p1clean = JSON.parse(JSON.stringify(blocks.p1||[]));
  var p2clean = JSON.parse(JSON.stringify(blocks.p2||[]));
  var p3clean = JSON.parse(JSON.stringify(blocks.p3||[]));
  var blocksData = { p1: p1clean, p2: p2clean, p3: p3clean };
  extraPages.forEach(function(p){ blocksData[p.key] = JSON.parse(JSON.stringify(blocks[p.key]||[])); });
  var savePath = 'templates/' + BIZ_ID;

  console.log('パス:', savePath);
  console.log('uid:', user.uid);
  console.log('ブロック数 p1=' + p1clean.length + ' p2=' + p2clean.length + ' p3=' + p3clean.length + ' extra=' + extraPages.length);
  console.log('p2 blocks:', JSON.stringify(p2clean));
  console.log('p3 blocks:', JSON.stringify(p3clean));
  console.groupEnd();
  var ref = db.collection('templates').doc(BIZ_ID);
  try {
    ref.set({ blocks: blocksData, extraPages: JSON.parse(JSON.stringify(extraPages)), updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(function() {
        console.log('[Editor] 保存成功:', savePath, 'p2='+p2clean.length+' p3='+p3clean.length);
        clearDirty(); showToast('保存しました'); btn.textContent = '保存';

function resetToDefault() {
  if (!confirm('デフォルト状態に戻しますか？（「保存」するまでFirestoreには反映されません）')) return;
  blocks = { p1: JSON.parse(JSON.stringify(DEFAULT_BLOCKS.p1)), p2: JSON.parse(JSON.stringify(DEFAULT_BLOCKS.p2)), p3: JSON.parse(JSON.stringify(DEFAULT_BLOCKS.p3)) };
  extraPages = [];
  expandedIds = {};
  if (['p1','p2','p3'].indexOf(currentPage) < 0) currentPage = 'p1';
  renderExtraTabs();
  renderAll();
  markDirty();
}

/* ── Page switch ── */
function switchPage(page) {
  if (page === currentPage) return;
  if (isDirty && !confirm('保存されていない変更があります。このページを離れますか？')) return;
  currentPage = page;
  document.querySelectorAll('.h-tab').forEach(function(t) { t.classList.toggle('active', t.dataset.page===page); });
  renderAll();
}

function renderExtraTabs() {
  var container = document.getElementById('extra-page-tabs');
  if (!container) return;
  container.innerHTML = extraPages.map(function(p) {
    return '<button class="h-tab' + (currentPage===p.key?' active':'') + '" data-page="' + escHtml(p.key) + '" onclick="switchPage(\'' + escId(p.key) + '\')">'
      + escHtml(p.label)
      + '<span onclick="event.stopPropagation();removePage(\'' + escId(p.key) + '\')" style="margin-left:6px;opacity:.55;font-size:10px;line-height:1" title="削除">✕</span>'
      + '</button>';
  }).join('');
}

function addPage() {
  var nextNum = 4 + extraPages.length;
  var defaultLabel = 'P' + nextNum;
  var label = prompt('新しいページの名前を入力してください:', defaultLabel);
  if (label === null) return;
  label = label.trim() || defaultLabel;
  var key = 'p' + nextNum;
  extraPages.push({key: key, label: label});
  if (!blocks[key]) blocks[key] = [];
  markDirty();
  renderExtraTabs();
  switchPage(key);
}

function removePage(key) {
  if (!confirm('「' + (extraPages.find(function(p){return p.key===key;})||{}).label + '」を削除しますか？')) return;
  extraPages = extraPages.filter(function(p){ return p.key !== key; });
  delete blocks[key];
  markDirty();
  renderExtraTabs();
  if (currentPage === key) switchPage('p3');
}

/* ── Render helpers ── */
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escId(s)   { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function processText(s) { return escHtml(s||'').replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>'); }

/* ── Preview render ── */
var SPACE_PX = { small:'16px', medium:'32px', large:'64px' };

function renderBlock(b) {
  var t = processText(b.text);
  switch (b.style) {
    case 'title':    return '<div style="font-size:20px;font-weight:700;color:#1a1a1a;margin-top:40px;margin-bottom:18px">'+t+'</div>';

    case 'muted':    return '<div style="margin-bottom:12px;color:#999;font-size:10.5px">'+t+'</div>';
    case 'space':    return '<div style="height:'+(SPACE_PX[b.spaceSize||'medium']||'32px')+'"></div>';
    case 'url-ext':     return '<div style="margin-bottom:24px">'+processText(b.text)+'<br><a href="'+escHtml(b.url||'#')+'" style="color:'+BG_TEXT_COLOR+';word-break:break-all" target="_blank">'+escHtml(b.url||'')+'</a></div>';
    case 'link-locked':return '<div style="margin-bottom:8px"><a href="'+escHtml(b.url||'#')+'" target="_blank" style="display:inline-flex;align-items:center;gap:6px;background:#f1f3f4;border:1px solid #dadce0;border-radius:4px;padding:4px 12px;text-decoration:none;color:#1a1a1a;font-size:12px;font-weight:600">🔗 '+processText(b.text)+'</a></div>';

    case 'url-store':return '<div style="margin-bottom:48px">'+processText(b.text||'▼加盟店様の紹介ページ')+'<br><span style="color:'+BG_TEXT_COLOR+';font-size:11px">（加盟店紹介URL・設定画面で変更）</span></div>';

function renderPreview() {
  var el = document.getElementById('preview-content');
  if (!el) return;
  if (currentPage === 'p1') {
    var _pv={};
    if(p1Plan&&p1Plan.indexOf(':')>-1){
      var _pp=p1Plan.split(':'),_d=_planDetails.find(function(d){return d.id===_pp[0];}),
          _tm=_d&&_planTemplates.find(function(t){return t.id===_d.templateId;});
      if(_tm&&_d){
        var _tv=(_d.values||{})[_pp[1]]||{},_gi=function(i){return escHtml((_tm.items[i]&&_tv[_tm.items[i].id])||'—');};
        _pv['_p1_p_name']=escHtml(_pp[1]);_pv['_p1_p_fee']=_gi(0);_pv['_p1_p_comm']=_gi(1);
        _pv['_p1_p_guar']=_gi(2);_pv['_p1_p_mon']=_gi(3);_pv['_p1_p_per']=_gi(4);_pv['_p1_p_half']=_gi(5);
      }
    }
    var rows=(blocks.p1||[]).map(function(b){
      var t=processText(b.text||'');
      switch(b.style){
        case 'p1-2col':    return '<tr><td class="k">'+escHtml(b.leftKey||'')+'</td><td class="v">—</td><td class="k">'+escHtml(b.rightKey||'')+'</td><td class="v">—</td></tr>';

        case 'p1-key':     return '<tr><td class="k">'+t+'</td><td class="v" colspan="3">'+(_pv[b.id]||'—')+'</td></tr>';
        case 'p1-val':     return '<tr><td colspan="4" class="v note" style="padding:8px 20px'+(b.isDummy?';color:#bbb':'')+' ">'+t+'</td></tr>';
        case 'p1-holiday': return '<tr><td colspan="4" class="v note" style="padding:8px 20px'+(b.isDummy?';color:#bbb':'')+' ">'+t+'</td></tr>';
        case 'p1-exclude': return '<tr><td colspan="4" class="v note" style="padding:8px 20px'+(b.isDummy?';color:#bbb':'')+' ">'+t+'</td></tr>';
        case 'p1-contract':return '<tr><td colspan="4" class="v note" style="padding:8px 20px'+(b.isDummy?';color:#bbb':'')+' ">'+t+'</td></tr>';
        default:           return '<tr><td colspan="4" class="v"'+(b.isDummy?' style="color:#bbb"':'')+'>'+t+'</td></tr>';
      }
    }).join('');
    el.innerHTML='<table class="doc-table"><colgroup><col style="width:220px"><col><col style="width:220px"><col></colgroup>'+rows+'</table>';
  } else {
    el.innerHTML = (blocks[currentPage]||[]).map(function(b){ var h=renderBlock(b); return b.isDummy?'<div style="opacity:0.5;color:#bbb">'+h+'</div>':h; }).join('');
  }
}

      +'</div>';
  }

  if (FULLY_LOCKED.hasOwnProperty(b.style)) {
    return '<div class="block-card block-special"'+cardDnd+'>'
      +'<div class="bc-head">'+handle
      +'<span class="bc-special-tag">'+FULLY_LOCKED[b.style]+'</span>'+del
      +'</div></div>';
  }

  /* 半ロック（url-photo / url-store）: ラベル編集可・URL固定 */
  if (SEMI_LOCKED.hasOwnProperty(b.style)) {
    var slLabel = SEMI_LOCKED[b.style];
    var slBadge = '<span class="bc-badge" style="background:#fff3e0;color:#e65100">'+slLabel+'</span>';
    var slPre   = (b.text||'').replace(/\n/g,' ');
    slPre = slPre.length > 44 ? slPre.substring(0,44)+'…' : slPre;
    var bodyH   = expanded ? '' : ' style="display:none"';
    return '<div class="block-card"'+cardDnd+'>'
      +'<div class="bc-head" onclick="toggleCard(\''+bid+'\')">'
      +handle+slBadge+'<span class="bc-preview">'+escHtml(slPre)+'</span>'+arrow+del
      +'</div>'
      +'<div class="bc-body"'+bodyH+'>'
      +'<span class="bc-field-label">ラベルテキスト</span>'
      +'<textarea class="bc-textarea" rows="2" placeholder="リンクのラベルテキスト" data-idx="'+idx+'" data-field="text" oninput="updateBlock(this)">'+escHtml(b.text||'')+'</textarea>'
      +'<div class="bc-lock-row"><span class="bc-lock-icon">🔒</span><input class="bc-url-locked" type="text" value="'+escHtml(SEMI_URL_LABEL[b.style])+'" disabled></div>'
      +'</div>'
      +'</div>';
  }

  /* 外部URLブロック（url-ext）: テキスト編集可・URL固定・P2 url-photo形式 */
  if (b.style === 'url-ext') {
    var uePre = (b.text||'').replace(/\n/g,' ');
    uePre = uePre.length > 44 ? uePre.substring(0,44)+'…' : uePre;
    var bodyH = expanded ? '' : ' style="display:none"';
    return '<div class="block-card"'+cardDnd+'>'
      +'<div class="bc-head" onclick="toggleCard(\'' +bid+ '\')">'
      +handle+'<span class="bc-badge" style="background:#e3f2fd;color:#1565c0">🔗 外部URL</span>'
      +'<span class="bc-preview">'+escHtml(uePre)+'</span>'+arrow+del
      +'</div>'
      +'<div class="bc-body"'+bodyH+'>'
      +'<span class="bc-field-label">表示テキスト</span>'
      +'<textarea class="bc-textarea" rows="2" placeholder="リンクラベルテキスト" data-idx="'+idx+'" data-field="text" oninput="updateBlock(this)">'+escHtml(b.text||'')+'</textarea>'
      +'<div class="bc-lock-row"><span class="bc-lock-icon">🔒</span><input class="bc-url-locked" type="text" value="'+escHtml(b.url||'')+'" disabled></div>'
      +'</div>'
      +'</div>';
  }

  /* ロックリンクブロック（link-locked）: テキスト編集可・URL固定 */
  if (b.style === 'link-locked') {
    var llPre = (b.text||'').replace(/\n/g,' ');
    llPre = llPre.length > 44 ? llPre.substring(0,44)+'…' : llPre;
    var bodyH = expanded ? '' : ' style="display:none"';
    return '<div class="block-card"'+cardDnd+'>'
      +'<div class="bc-head" onclick="toggleCard(\'' +bid+ '\')">'
      +handle+'<span class="bc-badge" style="background:#e3f2fd;color:#1565c0">🔗 リンク</span>'
      +'<span class="bc-preview">'+escHtml(llPre)+'</span>'+arrow+del
      +'</div>'
      +'<div class="bc-body"'+bodyH+'>'
      +'<span class="bc-field-label">表示テキスト</span>'
      +'<textarea class="bc-textarea" rows="2" placeholder="リンクの表示テキスト" data-idx="'+idx+'" data-field="text" oninput="updateBlock(this)">'+escHtml(b.text||'')+'</textarea>'
      +'<div class="bc-lock-row"><span class="bc-lock-icon">🔒</span><input class="bc-url-locked" type="text" value="'+escHtml(b.url||'')+'" disabled></div>'
      +'</div>'
      +'</div>';
  }

  /* 2ブロック（p1-2col） */
  if (b.style === 'p1-2col') {
    var _2pre = [b.leftKey, b.rightKey].filter(Boolean).join('  |  ');
    _2pre = _2pre.length > 44 ? _2pre.substring(0,44)+'…' : _2pre;
    var _2bH = expanded ? '' : ' style="display:none"';
    var _2so = P1_STYLE_OPTS.map(function(o){ return '<option value="'+o[0]+'"'+(b.style===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('');
    var _inp2 = function(lbl,fld,ph){ return '<div class="bc-row"><span class="bc-row-label">'+lbl+'</span><input type="text" style="flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit" value="'+escHtml(b[fld]||'')+'" data-idx="'+idx+'" data-field="'+fld+'" oninput="updateBlock(this)" placeholder="'+ph+'"></div>'; };
    var _2ftTmpl=_planTemplates.find(function(t){return t.id===p1Plan;});
    var _2fmkOpts=function(cur){return _2ftTmpl?_2ftTmpl.items.map(function(item){return '<option value="'+escHtml(item.label||'')+'"'+(cur===(item.label||'')?' selected':'')+'>'+escHtml(item.label||'')+'</option>';}).join(''):'<option value="">（プラン形態を先に選択）</option>';};
    var _2leftF = b.isFromTemplate
      ? '<div class="bc-row"><span class="bc-row-label">左・項目</span><select style="flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit" data-idx="'+idx+'" data-field="leftKey" onchange="selectFromTemplateField(this)">'+_2fmkOpts(b.leftKey||'')+'</select></div>'
      : _inp2('左・項目名','leftKey','例：月額費用（税抜）');
    var _2rightF = b.isFromTemplate
      ? '<div class="bc-row"><span class="bc-row-label">右・項目</span><select style="flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit" data-idx="'+idx+'" data-field="rightKey" onchange="selectFromTemplateField(this)">'+_2fmkOpts(b.rightKey||'')+'</select></div>'
      : _inp2('右・項目名','rightKey','例：成約手数料');
    return '<div class="block-card"'+cardDnd+'>'
      +'<div class="bc-head" onclick="toggleCard(\''+bid+'\')">'
      +handle+'<span class="bc-badge" style="background:#FFF3E0;color:#E65100">2ブロック</span>'
      +'<span class="bc-preview">'+escHtml(_2pre||'（空）')+'</span>'+arrow+del
      +'</div>'
      +'<div class="bc-body"'+_2bH+'>'
      +'<div class="bc-row"><span class="bc-row-label">スタイル</span><select class="bc-style-sel" data-idx="'+idx+'" onchange="updateStyle(this)">'+_2so+'</select></div>'
      +'<div class="bc-row" style="margin-top:4px"><label style="font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:3px;cursor:pointer;white-space:nowrap"><input type="checkbox" data-idx="'+idx+'" onchange="toggleFromTemplate(this)"'+(b.isFromTemplate?' checked':'')+'> 設定から引用</label></div>'
      +_2leftF
      +_2rightF
      +'</div>'
      +'</div>';
  }

  /* 通常ブロック */
  var label  = STYLE_LABEL[b.style] || b.style;
  var badge  = '<span class="bc-badge" style="'+badgeStyle(b.style)+'">'+label+'</span>';
  var rawPre = b.style==='space'
    ? (SPACE_LABEL[b.spaceSize||'medium']||'')
    : (b.text||'').replace(/\n/g,' ').replace(/\*\*/g,'');
  rawPre = rawPre.length > 44 ? rawPre.substring(0,44)+'…' : rawPre;
  var bodyH = expanded ? '' : ' style="display:none"';

  var opts = getStyleOpts().map(function(o){
    return '<option value="'+o[0]+'"'+(b.style===o[0]?' selected':'')+'>'+o[1]+'</option>';
  }).join('');
  var styleRow = '<div class="bc-row"><span class="bc-row-label">スタイル</span>'
    +'<select class="bc-style-sel" data-idx="'+idx+'" onchange="updateStyle(this)">'+opts+'</select>'
    +'<label style="font-size:11px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:3px;margin-left:8px;cursor:pointer"><input type="checkbox" data-idx="'+idx+'" onchange="toggleDummy(this)"'+(b.isDummy?' checked':'')+'> ダミーテキスト</label></div>';

  var bodyContent = (b.style==='space')
    ? '<div class="bc-row"><span class="bc-row-label">サイズ</span>'
      +'<select class="bc-space-sel" data-idx="'+idx+'" data-field="spaceSize" onchange="updateBlock(this)">'
      +['small','medium','large'].map(function(sz){
        return '<option value="'+sz+'"'+((b.spaceSize||'medium')===sz?' selected':'')+'>'+SPACE_LABEL[sz]+'</option>';
      }).join('')+'</select></div>'
    : '<textarea class="bc-textarea" rows="3" placeholder="テキスト内容（Enterで改行・**テキスト**で太字）" data-idx="'+idx+'" data-field="text" oninput="updateBlock(this)">'+escHtml(b.text||'')+'</textarea>';

  return '<div class="block-card"'+cardDnd+'>'
    +'<div class="bc-head" onclick="toggleCard(\''+bid+'\')">'
    +handle+badge+'<span class="bc-preview">'+escHtml(rawPre)+'</span>'+arrow+del
    +'</div>'
    +'<div class="bc-body"'+bodyH+'>'+styleRow+bodyContent+'</div>'
    +'</div>';
}

function renderEditor() {
  var list = document.getElementById('block-list');
  if (!list) return;
  var bar = document.getElementById('p1-plan-bar');
  if (bar) { bar.style.display = currentPage === 'p1' ? '' : 'none'; if (currentPage==='p1') refreshP1PlanSel(); }
  var arr = blocks[currentPage]||[];
  list.innerHTML = arr.map(function(b,i){ return buildCard(b,i); }).join('');
}

function renderAll() { renderPreview(); renderEditor(); }

/* ── Toggle collapse ── */
function toggleCard(blockId) {
  expandedIds[blockId] = !expandedIds[blockId];
  var card = document.querySelector('.block-card[data-blockid="'+blockId+'"]');
  if (!card) return;
  var body  = card.querySelector('.bc-body');
  var arrow = card.querySelector('.bc-arrow');
  if (body)  body.style.display  = expandedIds[blockId] ? '' : 'none';
  if (arrow) arrow.textContent   = expandedIds[blockId] ? '▼' : '▶';
}

/* ── Update handlers ── */
function updateStyle(sel) {
  markDirty();
  var idx = parseInt(sel.dataset.idx);
  blocks[currentPage][idx].style = sel.value;
  if (sel.value==='space' && !blocks[currentPage][idx].spaceSize) blocks[currentPage][idx].spaceSize = 'medium';
  renderAll();
}

function updateBlock(inp) {
  markDirty();
  var idx = parseInt(inp.dataset.idx);
  blocks[currentPage][idx][inp.dataset.field] = inp.value;
  renderPreview();
  /* ヘッダーのプレビューテキストだけ差し替え（フォーカスを失わないよう最小更新） */
  var card = document.querySelector('#block-list .block-card[data-idx="'+idx+'"]');
  if (card) {
    var pre = card.querySelector('.bc-preview');
    if (pre) {
      var b = blocks[currentPage][idx];
      var raw;
      if (b.style==='p1-2col') {
        raw=[b.leftKey,b.rightKey].filter(Boolean).join('  |  ');
      } else if (b.style==='space') {
        raw=SPACE_LABEL[b.spaceSize||'medium']||'';
      } else {
        raw=(b.text||'').replace(/\n/g,' ').replace(/\*\*/g,'');
      }
      pre.textContent = raw.length > 44 ? raw.substring(0,44)+'…' : raw;
    }
  }
}

function toggleDummy(chk) {
  markDirty();
  var idx = parseInt(chk.dataset.idx);
  blocks[currentPage][idx].isDummy = chk.checked;
  renderPreview();
}
function toggleFromTemplate(chk) {
  markDirty();
  var idx = parseInt(chk.dataset.idx);
  blocks[currentPage][idx].isFromTemplate = chk.checked;
  renderAll();
}
function selectFromTemplate(sel) {
  markDirty();
  var idx = parseInt(sel.dataset.idx);
  blocks[currentPage][idx].text = sel.value;
  renderPreview();
  var card = document.querySelector('#block-list .block-card[data-idx="'+idx+'"]');
  if (card) { var pre = card.querySelector('.bc-preview'); if (pre) pre.textContent = sel.value.substring(0,44); }
}
function selectFromTemplateField(sel) {
  markDirty();
  var idx = parseInt(sel.dataset.idx);
  blocks[currentPage][idx][sel.dataset.field] = sel.value;
  renderPreview();
  var card = document.querySelector('#block-list .block-card[data-idx="'+idx+'"]');
  if (card) {
    var pre = card.querySelector('.bc-preview');
    if (pre) {
      var b2=blocks[currentPage][idx];
      pre.textContent=[b2.leftKey,b2.rightKey].filter(Boolean).join('  |  ').substring(0,44);
    }
  }
}

function delBlock(idx) {
  if (!confirm('このブロックを削除しますか？')) return;
  markDirty();
  blocks[currentPage].splice(idx,1);
  renderAll();
}

function addBlock() {
  markDirty();
  var nb = { id:'new_'+Date.now(), style: currentPage==='p1'?'p1-sh':'body', text:'' };
  blocks[currentPage].push(nb);
  expandedIds[nb.id] = true;   /* 追加時は展開状態 */
  renderAll();
  setTimeout(function() {
    var last = document.querySelector('#block-list .block-card:last-child');
    if (last) last.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }, 60);
}

/* ── Drag & Drop ── */
function startDrag(e) {
  /* ≡ハンドル自身がdraggable="true"なので、e.currentTargetは≡span */
  dragSrcIdx = parseInt(e.currentTarget.dataset.idx);
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(dragSrcIdx));
  /* ドラッグイメージをカード全体に */
  var card = e.currentTarget.closest ? e.currentTarget.closest('.block-card') : null;
  if (card) {
    try { e.dataTransfer.setDragImage(card, 20, 12); } catch(ex) {}
    setTimeout(function() { card.classList.add('dragging'); }, 0);
  }
}

function overDrag(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  var ti = parseInt(e.currentTarget.dataset.idx);
  document.querySelectorAll('#block-list .block-card').forEach(function(c) {
    c.classList.toggle('drag-over', parseInt(c.dataset.idx)===ti && ti!==dragSrcIdx);
  });
}

function dropDrag(e) {
  e.preventDefault();
  var ti = parseInt(e.currentTarget.dataset.idx);
  if (dragSrcIdx < 0 || dragSrcIdx === ti) { dragSrcIdx = -1; return; }
  markDirty();
  var arr   = blocks[currentPage];
  var moved = arr.splice(dragSrcIdx, 1)[0];
  arr.splice(ti > dragSrcIdx ? ti - 1 : ti, 0, moved);
  dragSrcIdx = -1;
  renderAll();
}

function endDrag(e) {
  dragSrcIdx = -1;
  document.querySelectorAll('#block-list .block-card').forEach(function(c) {
    c.classList.remove('dragging','drag-over');
  });
}

function leaveDrag(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) e.currentTarget.classList.remove('drag-over');
}

/* ── Preview scale ── */
function scalePreview() {
  var pane = document.getElementById('preview-pane');
  var wrap = document.getElementById('preview-page-wrap');
  if (!pane||!wrap) return;
  var s = Math.min(1, Math.max(0.3, (pane.clientWidth-40)/794));
  wrap.style.transform = 'scale('+s+')';
  wrap.style.transformOrigin = 'top center';
  wrap.style.marginBottom = (Math.round(1200*s)-1200+20)+'px';
}
window.addEventListener('beforeunload', function(e) {
  if (!isDirty) return;
  e.preventDefault();
  e.returnValue = '';
});
window.addEventListener('resize', scalePreview);

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

var _editorInitDone = false;
firebase.auth().onAuthStateChanged(function(user) {
  if (!user) return;
  if (_editorInitDone) return; // token refresh 時に再ロードしない
  _editorInitDone = true;
  loadTemplate();
  loadPlanData();
});
</script>
</body>
